<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Below the Waterline · Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.horizon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:2.4rem}
@media (max-width:820px){.horizon{grid-template-columns:1fr}}
.hcol{border:1px solid var(--line);border-radius:14px;background:var(--deep);padding:1rem 1.1rem}
.hcol h3{font-family:var(--mono);font-weight:400;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brine);margin-bottom:.7rem;display:flex;justify-content:space-between}
.hcol h3 span{color:var(--muted)}
.hcol button{display:block;width:100%;text-align:left;font:inherit;font-size:.92rem;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:.55rem 0 .55rem .9rem;cursor:pointer;position:relative}
.hcol button::before{content:"";position:absolute;left:0;top:.95rem;width:7px;height:7px;border-radius:50%;background:var(--c)}
.hcol button:hover{color:var(--brine)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.8rem}
.filters .lab{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:.3rem;min-width:3.5rem}
.filters button{font:inherit;font-family:var(--mono);font-size:.76rem;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.38rem .8rem;cursor:pointer}
.filters button:hover{color:var(--ink);border-color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--brine);color:var(--abyss);border-color:var(--brine)}
.count{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin:1rem 0}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.recs{grid-template-columns:1fr}}
.rec{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;background:linear-gradient(180deg,var(--deep2),var(--deep));padding:1.2rem 1.3rem;display:grid;gap:.7rem;align-content:start;scroll-margin-top:80px;transition:box-shadow .3s}
.rec.flash{box-shadow:0 0 0 2px var(--c)}
.rec .top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.rec .lens{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.rec .when{font-family:var(--mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:.12rem .45rem}
.rec h3{font-size:1.45rem}
.rec .why{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:.7rem}
.rec .why b{font-family:var(--mono);font-weight:400;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-right:.3rem}
.who{display:flex;flex-wrap:wrap;gap:.4rem}
.who span{font-size:.78rem;border-radius:999px;background:rgba(118,211,198,.08);border:1px solid var(--line);padding:.15rem .6rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
  <div id="head"></div>
  <section class="block" style="border-top:0;padding-top:20px" aria-labelledby="h-when">
    <div class="wrap">
      <h2 id="h-when" style="font-size:1.6rem;margin-bottom:1rem">When each step should happen</h2>
      <div class="horizon" id="horizon"></div>
      <h2 style="font-size:1.6rem;margin-bottom:1rem">All recommendations</h2>
      <div class="filters" id="fLens" role="group" aria-label="Filter by lens"></div>
      <div class="filters" id="fWho" role="group" aria-label="Filter by who acts"></div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="recs" id="recs"></div>
    </div>
  </section>
  <section class="block notes" aria-labelledby="h-notes"><div class="wrap"><h2 id="h-notes" style="font-size:1.4rem;margin-bottom:1rem">Notes</h2><ol id="notes"></ol></div></section>
</main>
<footer id="site-footer"></footer>
<script src="data.js"></script>
<script>
renderChrome("solutions.html");
document.getElementById("head").innerHTML=pageHead("06","What should happen next","Twelve recommendations across the three lenses, sorted by who acts and when. They are the author's judgement; each “Why” line links to the evidence behind it.","Solutions");
drawWaves();
const COL={security:"var(--brine)",conflict:"var(--alert)",aus:"var(--sediment)"};
document.getElementById("horizon").innerHTML=Object.entries(SOL_WHEN).map(([k,l])=>{ const items=SOL.filter(r=>r.when===k); return `<div class="hcol"><h3>${l}<span>${items.length}</span></h3>${items.map(r=>`<button type="button" data-go="${r.id}" style="--c:${COL[r.lens]}">${r.title}</button>`).join("")}</div>`; }).join("");
let lens="all", who="all", READY=false;
const ACTORS=[...new Set(SOL.flatMap(r=>r.who))];
document.getElementById("fLens").innerHTML=`<span class="lab">Lens</span>`+[["all","All"],...Object.entries(SOL_LENS)].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
document.getElementById("fWho").innerHTML=`<span class="lab">Who</span>`+[["all","Everyone"],...ACTORS.map(a=>[a,a])].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
function wire(id,set){ document.getElementById(id).addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.k); document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b)); draw(); }); }
wire("fLens",v=>lens=v); wire("fWho",v=>who=v);
function draw(){
  const list=SOL.filter(r=>(lens==="all"||r.lens===lens)&&(who==="all"||r.who.includes(who)));
  document.getElementById("count").textContent=`Showing ${list.length} of ${SOL.length}`;
  document.getElementById("recs").innerHTML=list.map((r,i)=>`<article class="rec reveal" id="${r.id}" style="--c:${COL[r.lens]};animation-delay:${i*.04}s"><div class="top"><span class="lens">${SOL_LENS[r.lens]}</span><span class="when">${SOL_WHEN[r.when]}</span></div><h3>${r.title}</h3><p>${r.act}</p><p class="why"><b>Why</b>${withRefs(r.why)}</p><div class="who">${r.who.map(w=>`<span>${w}</span>`).join("")}</div></article>`).join("") || `<p class="muted">No recommendation matches both filters.</p>`;
  if(READY) paintRefs(document.getElementById("recs"));
}
document.getElementById("horizon").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(!document.getElementById(b.dataset.go)){ lens="all"; who="all"; document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k==="all")); draw(); }
  const el=document.getElementById(b.dataset.go); el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1600); });
draw(); finishPage(); READY=true;
</script>
<script src="../assets/portfolio.js"></script>
</body>
</html>
