<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Below the Waterline · Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.filters button{font:inherit;font-family:var(--mono);font-size:.76rem;letter-spacing:.04em;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;cursor:pointer}
.filters button:hover{color:var(--ink);border-color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--brine);color:var(--abyss);border-color:var(--brine)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feed li{display:grid;grid-template-columns:7rem 1fr;gap:1rem;border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;background:var(--deep)}
@media (max-width:560px){.feed li{grid-template-columns:1fr}}
.feed .d{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.feed .t{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brine);display:block;margin-bottom:.25rem}
.feed li.ahead{border-style:dashed}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brine);margin-right:.5rem;box-shadow:0 0 0 0 rgba(118,211,198,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bib p{padding-left:2rem;text-indent:-2rem;font-size:.93rem;color:var(--muted);margin:.6rem 0}
.search{width:100%;max-width:420px;font:inherit;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem}
.search:focus{outline:2px solid var(--brine);outline-offset:1px}
.counts{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.counts div{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;background:var(--deep);min-width:140px}
.counts b{display:block;font-family:var(--display);font-size:2rem;line-height:1}
.counts span{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
  <div id="head"></div>
  <section class="block" style="border-top:0;padding-top:16px" aria-label="Watchlist">
    <div class="wrap">
      <div class="counts" id="counts"></div>
      <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
      <div class="scroll-x"><table class="table"><thead><tr><th scope="col">Item</th><th scope="col">Target or pledge</th><th scope="col">Owner</th><th scope="col">Status</th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="mono muted" style="margin-top:1rem">Target: proposed in an official concept paper · Pledged: announced by an actor · Watch: expected in Abu Dhabi · Delivered: confirmed by a source</p>
    </div>
  </section>
  <section class="block notes" aria-labelledby="h-notes"><div class="wrap"><h2 id="h-notes" style="font-size:1.4rem;margin-bottom:1rem">Notes</h2><ol id="notes"></ol></div></section>
</main>
<footer id="site-footer"></footer>
<script src="data.js"></script>
<script>
renderChrome("watchlist.html");
document.getElementById("head").innerHTML=pageHead("05","What would count as success","Measurable targets and pledges already on the table. The status of each item is updated as announcements are made.","Accountability watchlist");
drawWaves();
const LAB={target:"Target",pledge:"Pledged",watch:"Watch",done:"Delivered"};
const n=k=>LIVE.scorecard.filter(r=>r.st===k).length;
document.getElementById("counts").innerHTML=Object.keys(LAB).map(k=>`<div><b class="num">${n(k)}</b><span>${LAB[k]}</span></div>`).join("");
let READY=false, filt="all";
document.getElementById("filters").innerHTML=[["all","All"],...Object.entries(LAB)].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
document.getElementById("filters").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; filt=b.dataset.k; document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed",x===b)); rows(); });
function rows(){ document.getElementById("rows").innerHTML=LIVE.scorecard.filter(r=>filt==="all"||r.st===filt).map(r=>`<tr class="reveal"><td>${r.item}</td><td>${r.target}${sup(r.s)}</td><td class="muted">${r.owner}</td><td><span class="chip ${r.st}">${LAB[r.st]}</span></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Nothing in this status yet.</td></tr>`; if(READY) paintRefs(document.getElementById("rows")); }
rows(); finishPage(); READY=true;
</script>
<script src="../assets/portfolio.js"></script>
</body>
</html>
